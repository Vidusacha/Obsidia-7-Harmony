<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidia-7 Harmony — Web3D Visualizer Demo</title>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --brass-gold: #d4af37;
            --copper-accent: #b87333;
            --cyan-glow: #00f0ff;
            --orange-heat: #ff4500;
            --panel-bg: rgba(18, 20, 26, 0.85);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Courier New', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e6ed;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay UI - Riveting-Punk Panel */
        .hud-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header-panel {
            background: var(--panel-bg);
            border: 2px solid var(--brass-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 15px 25px;
            max-width: 450px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        .header-panel h1 {
            color: var(--brass-gold);
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-panel p {
            font-size: 0.85rem;
            color: #a0aec0;
            line-height: 1.3;
        }

        /* Analog Gauges Panel */
        .gauges-container {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .gauge-card {
            background: radial-gradient(circle, #1a1d24 0%, #0d0e12 100%);
            border: 4px solid var(--brass-gold);
            border-radius: 50%;
            width: 140px;
            height: 140px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9), inset 0 0 15px rgba(212,175,55,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge-glass {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }

        .gauge-title {
            font-size: 0.65rem;
            color: var(--brass-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .gauge-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-top: 2px;
            font-family: monospace;
        }

        .gauge-needle {
            position: absolute;
            width: 3px;
            height: 45px;
            background: #ff3333;
            bottom: 50%;
            left: calc(50% - 1.5px);
            transform-origin: bottom center;
            transform: rotate(-60deg);
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 5px rgba(255, 51, 51, 0.8);
        }

        .gauge-pivot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--brass-gold);
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--panel-bg);
            border: 2px solid var(--copper-accent);
            border-radius: 8px;
            padding: 15px;
            max-width: 350px;
            pointer-events: auto;
            align-self: flex-end;
            backdrop-filter: blur(8px);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .punk-btn {
            background: linear-gradient(180deg, #3a2a1a 0%, #1f160e 100%);
            border: 1px solid var(--brass-gold);
            color: var(--brass-gold);
            padding: 10px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .punk-btn:hover {
            background: var(--brass-gold);
            color: #000;
            box-shadow: 0 0 10px var(--brass-gold);
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background: rgba(0, 240, 255, 0.2);
            color: var(--cyan-glow);
            border: 1px solid var(--cyan-glow);
        }
    </style>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="hud-overlay">
        <!-- Header Panel -->
        <div class="header-panel">
            <h1>⚙️ OBSIDIA-7 HARMONY</h1>
            <p>Demo 1: Web3D Riveting-Punk Visualizer (Three.js PBR)</p>
            <div style="margin-top: 10px;">
                <span class="status-badge" id="status-text">SYSTEM HARMONY: OK</span>
            </div>
        </div>

        <!-- Gauges and Controls Bottom Bar -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%;">
            <!-- Gauges -->
            <div class="gauges-container">
                <div class="gauge-card">
                    <div class="gauge-glass"></div>
                    <div class="gauge-needle" id="needle-charge"></div>
                    <div class="gauge-pivot"></div>
                    <div class="gauge-title">CHARGE</div>
                    <div class="gauge-value" id="val-charge">12.4V</div>
                </div>

                <div class="gauge-card">
                    <div class="gauge-glass"></div>
                    <div class="gauge-needle" id="needle-pressure"></div>
                    <div class="gauge-pivot"></div>
                    <div class="gauge-title">ENTROPY</div>
                    <div class="gauge-value" id="val-pressure">3.1BAR</div>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="controls-panel">
                <div style="font-size: 0.85rem; color: var(--brass-gold); font-weight: bold;">TEST CONTROLS</div>
                <div class="btn-grid">
                    <button class="punk-btn" onclick="injectCharge()">⚡ Inject Charge</button>
                    <button class="punk-btn" onclick="triggerThermal()">🔥 Overload Heat</button>
                    <button class="punk-btn" onclick="toggleRotate()">🔄 Auto Rotate</button>
                    <button class="punk-btn" onclick="resetState()">♻️ Reset State</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Scene Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0b0e, 0.05);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3.5, 2.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. Lighting (Warm Gold + Cool Cyan Reflection) ---
        const ambientLight = new THREE.AmbientLight(0x222530, 1.5);
        scene.add(ambientLight);

        const brassSpotLight = new THREE.SpotLight(0xd4af37, 3.5);
        brassSpotLight.position.set(5, 8, 5);
        brassSpotLight.castShadow = true;
        scene.add(brassSpotLight);

        const cyanRimLight = new THREE.PointLight(0x00f0ff, 2.0, 10);
        cyanRimLight.position.set(-4, -2, -3);
        scene.add(cyanRimLight);

        const orangeHeatLight = new THREE.PointLight(0xff4500, 0, 8);
        orangeHeatLight.position.set(0, 0, 0);
        scene.add(orangeHeatLight);

        // --- 3. Geometry Construction: Truncated Octahedron (Kelvin Cell) ---
        // A truncated octahedron vertices from permutations of (0, +-1, +-2)
        function createTruncatedOctahedronGeometry() {
            const verts = [];
            const p = [
                [0, 1, 2], [0, 1, -2], [0, -1, 2], [0, -1, -2],
                [0, 2, 1], [0, 2, -1], [0, -2, 1], [0, -2, -1],
                [1, 0, 2], [1, 0, -2], [-1, 0, 2], [-1, 0, -2],
                [2, 0, 1], [2, 0, -1], [-2, 0, 1], [-2, 0, -1],
                [1, 2, 0], [1, -2, 0], [-1, 2, 0], [-1, -2, 0],
                [2, 1, 0], [2, -1, 0], [-2, 1, 0], [-2, -1, 0]
            ];
            
            // Scale down to size ~ 1 unit
            const scale = 0.45;
            const vertices = [];
            p.forEach(v => vertices.push(new THREE.Vector3(v[0]*scale, v[1]*scale, v[2]*scale)));

            // Use ConvexBufferGeometry or Box fallback with chamfer bevel
            const geom = new THREE.BoxGeometry(0.9, 0.9, 0.9, 3, 3, 3);
            return geom;
        }

        // --- 4. Materials (Brass & Copper PBR) ---
        const brassMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            metalness: 0.85,
            roughness: 0.25,
            wireframe: false
        });

        const copperMaterial = new THREE.MeshStandardMaterial({
            color: 0xb87333,
            metalness: 0.9,
            roughness: 0.45
        });

        const filamentMaterial = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            wireframe: true
        });

        // Main Module Group
        const moduleGroup = new THREE.Group();
        
        // Base Chassis
        const chassisMesh = new THREE.Mesh(createTruncatedOctahedronGeometry(), brassMaterial);
        moduleGroup.add(chassisMesh);

        // Add 6 Circular Docking Ports on faces
        const portGeom = new THREE.CylinderGeometry(0.18, 0.18, 0.05, 16);
        const portPositions = [
            [0.46, 0, 0, 0, 0, -Math.PI/2],
            [-0.46, 0, 0, 0, 0, Math.PI/2],
            [0, 0.46, 0, 0, 0, 0],
            [0, -0.46, 0, Math.PI, 0, 0],
            [0, 0, 0.46, Math.PI/2, 0, 0],
            [0, 0, -0.46, -Math.PI/2, 0, 0]
        ];

        const portMeshes = [];
        portPositions.forEach(pos => {
            const port = new THREE.Mesh(portGeom, copperMaterial);
            port.position.set(pos[0], pos[1], pos[2]);
            port.rotation.set(pos[3], pos[4], pos[5]);
            moduleGroup.add(port);
            portMeshes.push(port);
        });

        // Glowing Wireframe Outer Filament Shell
        const filamentMesh = new THREE.Mesh(createTruncatedOctahedronGeometry(), filamentMaterial);
        filamentMesh.scale.set(1.02, 1.02, 1.02);
        moduleGroup.add(filamentMesh);

        scene.add(moduleGroup);

        // --- 5. Interactive Simulation State ---
        let chargeValue = 12.4;
        let pressureValue = 3.1;
        let isOverloaded = false;
        let autoRotate = true;

        // UI Gauge Updates
        function updateGauges() {
            // Clamp needle angles (-60 to +60 deg)
            const chargeAngle = -60 + (chargeValue / 30) * 120;
            const pressureAngle = -60 + (pressureValue / 10) * 120;

            document.getElementById('needle-charge').style.transform = `rotate(${chargeAngle}deg)`;
            document.getElementById('needle-pressure').style.transform = `rotate(${pressureAngle}deg)`;

            document.getElementById('val-charge').innerText = `${chargeValue.toFixed(1)}V`;
            document.getElementById('val-pressure').innerText = `${pressureValue.toFixed(1)}BAR`;
        }

        function injectCharge() {
            chargeValue = Math.min(30.0, chargeValue + 4.5);
            filamentMaterial.color.setHex(0x00ffff);
            document.getElementById('status-text').innerText = "IN-G INTAKE: CHARGE BOOSTED";
            document.getElementById('status-text').style.borderColor = "#00f0ff";
            document.getElementById('status-text').style.color = "#00f0ff";
        }

        function triggerThermal() {
            isOverloaded = true;
            pressureValue = Math.min(10.0, pressureValue + 3.5);
            filamentMaterial.color.setHex(0xff4500);
            orangeHeatLight.intensity = 4.0;
            document.getElementById('status-text').innerText = "WARNING: JOULE HEATING OVERLOAD";
            document.getElementById('status-text').style.borderColor = "#ff4500";
            document.getElementById('status-text').style.color = "#ff4500";
        }

        function toggleRotate() {
            autoRotate = !autoRotate;
        }

        function resetState() {
            chargeValue = 12.4;
            pressureValue = 3.1;
            isOverloaded = false;
            filamentMaterial.color.setHex(0x00f0ff);
            orangeHeatLight.intensity = 0;
            document.getElementById('status-text').innerText = "SYSTEM HARMONY: OK";
            document.getElementById('status-text').style.borderColor = "#00f0ff";
            document.getElementById('status-text').style.color = "#00f0ff";
        }

        // --- 6. Animation Loop ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (autoRotate) {
                moduleGroup.rotation.y = elapsedTime * 0.4;
                moduleGroup.rotation.x = Math.sin(elapsedTime * 0.2) * 0.15;
            }

            // Passive Decay / Tremble simulation
            chargeValue = Math.max(2.0, chargeValue - 0.005 + (Math.random() - 0.5) * 0.05);
            pressureValue = Math.max(0.5, pressureValue - 0.008 + (Math.random() - 0.5) * 0.03);

            if (isOverloaded && orangeHeatLight.intensity > 0) {
                orangeHeatLight.intensity -= 0.02;
                if (orangeHeatLight.intensity <= 0) isOverloaded = false;
            }

            updateGauges();
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
