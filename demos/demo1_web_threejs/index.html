<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidia-7 Harmony — 3D Thermodynamic Evolution Game</title>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --brass-gold: #d4af37;
            --copper-accent: #b87333;
            --cyan-glow: #00f0ff;
            --orange-heat: #ff4500;
            --panel-bg: rgba(16, 18, 24, 0.90);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Courier New', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e6ed;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay HUD */
        .hud-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px;
        }

        .header-panel {
            background: var(--panel-bg);
            border: 2px solid var(--brass-gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.35), inset 0 0 12px rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            padding: 14px 20px;
            max-width: 520px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        .header-panel h1 {
            color: var(--brass-gold);
            font-size: 1.25rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .doom-clock-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--copper-accent);
            border-radius: 4px;
            padding: 6px 10px;
            margin-top: 6px;
            font-size: 0.8rem;
        }

        .doom-years {
            color: var(--orange-heat);
            font-weight: bold;
            font-family: monospace;
        }

        .harmony-val {
            color: var(--cyan-glow);
            font-weight: bold;
        }

        /* Analog Gauges Panel */
        .gauges-container {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .gauge-card {
            background: radial-gradient(circle, #1a1d24 0%, #0d0e12 100%);
            border: 3px solid var(--brass-gold);
            border-radius: 50%;
            width: 125px;
            height: 125px;
            position: relative;
            box-shadow: 0 6px 18px rgba(0,0,0,0.9), inset 0 0 12px rgba(212,175,55,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge-glass {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }

        .gauge-title {
            font-size: 0.6rem;
            color: var(--brass-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 14px;
        }

        .gauge-value {
            font-size: 1.05rem;
            font-weight: bold;
            color: #fff;
            margin-top: 2px;
            font-family: monospace;
        }

        .gauge-needle {
            position: absolute;
            width: 3px;
            height: 38px;
            background: #ff3333;
            bottom: 50%;
            left: calc(50% - 1.5px);
            transform-origin: bottom center;
            transform: rotate(-60deg);
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 5px rgba(255, 51, 51, 0.8);
        }

        .gauge-pivot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--brass-gold);
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--panel-bg);
            border: 2px solid var(--copper-accent);
            border-radius: 8px;
            padding: 12px 15px;
            max-width: 440px;
            pointer-events: auto;
            align-self: flex-end;
            backdrop-filter: blur(10px);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .punk-btn {
            background: linear-gradient(180deg, #3a2a1a 0%, #1f160e 100%);
            border: 1px solid var(--brass-gold);
            color: var(--brass-gold);
            padding: 8px 6px;
            font-size: 0.72rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            text-align: center;
        }

        .punk-btn:hover {
            background: var(--brass-gold);
            color: #000;
            box-shadow: 0 0 10px var(--brass-gold);
        }

        .ai-log-box {
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.7);
            border-left: 3px solid var(--brass-gold);
            font-size: 0.75rem;
            color: #d0d8e2;
            max-height: 55px;
            overflow-y: auto;
            font-style: italic;
        }
    </style>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="hud-overlay">
        <!-- Header Panel -->
        <div class="header-panel">
            <h1>⚙️ OBSIDIA-7 HARMONY</h1>
            <div class="doom-clock-bar">
                <div>💥 HELIOS-OMEGA: <span class="doom-years" id="doom-years">2,995,000 YRS</span></div>
                <div>DYNAMIC HARMONY: <span class="harmony-val" id="harmony-val">84.5%</span></div>
            </div>
            <div class="ai-log-box" id="ai-log">
                [Log]: Game Engine active. Use Steering buttons or A/D keys to pilot specimen.
            </div>
        </div>

        <!-- Gauges and Controls Bottom Bar -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%;">
            <!-- Gauges -->
            <div class="gauges-container">
                <div class="gauge-card">
                    <div class="gauge-glass"></div>
                    <div class="gauge-needle" id="needle-charge"></div>
                    <div class="gauge-pivot"></div>
                    <div class="gauge-title">CHARGE</div>
                    <div class="gauge-value" id="val-charge">50.0V</div>
                </div>

                <div class="gauge-card">
                    <div class="gauge-glass"></div>
                    <div class="gauge-needle" id="needle-pressure"></div>
                    <div class="gauge-pivot"></div>
                    <div class="gauge-title">ENTROPY</div>
                    <div class="gauge-value" id="val-pressure">2.0BAR</div>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="controls-panel">
                <div style="font-size: 0.8rem; color: var(--brass-gold); font-weight: bold;">PILOT CONTROLS</div>
                <div class="btn-grid">
                    <button class="punk-btn" onclick="steer(-0.25)">↩️ Steer Left</button>
                    <button class="punk-btn" onclick="steer(0.25)">↪️ Steer Right</button>
                    <button class="punk-btn" onclick="stepTick()">⏩ Thrust Step</button>
                    <button class="punk-btn" onclick="toggleAutoLoop()" id="btn-autoloop">▶️ Auto Play</button>
                    <button class="punk-btn" onclick="queryOllamaAI()">🤖 Ollama Log</button>
                    <button class="punk-btn" onclick="resetState()">♻️ Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Scene Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0b0e, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 15, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. Lighting & Environment Elements ---
        const ambientLight = new THREE.AmbientLight(0x222530, 2.0);
        scene.add(ambientLight);

        const brassSpotLight = new THREE.SpotLight(0xd4af37, 4.0);
        brassSpotLight.position.set(15, 30, 15);
        brassSpotLight.castShadow = true;
        scene.add(brassSpotLight);

        const oceanGrid = new THREE.GridHelper(80, 40, 0xb87333, 0x1f160e);
        oceanGrid.position.y = -1.5;
        scene.add(oceanGrid);

        // --- 3. Materials ---
        const brassMaterial = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.25 });
        const copperMaterial = new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.9, roughness: 0.4 });
        const cyanGlowMaterial = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
        const materiaMaterial = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });

        const blockGeom = new THREE.BoxGeometry(0.85, 0.85, 0.85);
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const aiGroup = new THREE.Group();
        scene.add(aiGroup);

        const envGroup = new THREE.Group();
        scene.add(envGroup);

        // --- 4. Live Game Loop & API Bridge ---
        let autoLoopTimer = null;
        let isAutoPlaying = false;
        let currentSteering = 0.0;
        let chargeValue = 50.0;
        let entropyValue = 2.0;

        async function fetchGameState() {
            try {
                const resp = await fetch('http://localhost:8000/api/game_state');
                if (resp.ok) {
                    const data = await resp.json();
                    renderGameState(data);
                }
            } catch (err) {
                renderStandaloneFallback();
            }
        }

        async function stepTick() {
            try {
                const resp = await fetch('http://localhost:8000/api/game_tick', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ steering_yaw: currentSteering })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    renderGameState(data);
                }
            } catch (err) {
                stepStandaloneFallback();
            }
            currentSteering = 0.0;
        }

        function steer(dir) {
            currentSteering += dir;
            stepTick();
        }

        function renderGameState(data) {
            // Update Doom Clock UI
            if (data.doom_clock) {
                document.getElementById('doom-years').innerText = data.doom_clock.years_formatted;
                document.getElementById('harmony-val').innerText = `${data.doom_clock.harmony_index}%`;
            }

            // Render Player Organism
            if (data.player) {
                const p = data.player;
                chargeValue = p.snapshot.charge || 50.0;
                entropyValue = p.snapshot.entropy || 2.0;
                playerGroup.position.set(p.pos[0], p.pos[1], p.pos[2]);
                playerGroup.rotation.y = p.yaw;

                // Build blocks
                while (playerGroup.children.length > 0) playerGroup.remove(playerGroup.children[0]);
                const blocks = (p.blueprint && p.blueprint.blocks) || [];
                blocks.forEach(b => {
                    const mat = b.type === "In-G" ? copperMaterial : brassMaterial;
                    const mesh = new THREE.Mesh(blockGeom, mat);
                    mesh.position.set(b.bcc[0]*0.9, b.bcc[1]*0.9, b.bcc[2]*0.9);
                    const wire = new THREE.Mesh(blockGeom, cyanGlowMaterial);
                    wire.scale.set(1.02, 1.02, 1.02);
                    mesh.add(wire);
                    playerGroup.add(mesh);
                });
            }

            // Render Environment (Gas Clouds & Materia Nodes)
            if (data.environment) {
                while (envGroup.children.length > 0) envGroup.remove(envGroup.children[0]);
                
                // Gas clouds
                (data.environment.gas_clouds || []).forEach(gc => {
                    const color = gc.type === "G_minus_minus" ? 0xff4500 : 0x00f0ff;
                    const cloudMat = new THREE.MeshBasicMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.25 });
                    const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(gc.radius, 12, 12), cloudMat);
                    cloudMesh.position.set(gc.pos[0], gc.pos[1], gc.pos[2]);
                    envGroup.add(cloudMesh);
                });

                // Materia scrap nodes
                (data.environment.materia_nodes || []).forEach(mn => {
                    const matMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), materiaMaterial);
                    matMesh.position.set(mn.pos[0], mn.pos[1], mn.pos[2]);
                    envGroup.add(matMesh);
                });
            }

            updateGauges();
        }

        function renderStandaloneFallback() {
            chargeValue = 50.0;
            entropyValue = 2.0;
            updateGauges();
        }

        function stepStandaloneFallback() {
            chargeValue = Math.min(100.0, chargeValue + 4.0);
            entropyValue = Math.max(0.5, entropyValue - 0.2);
            updateGauges();
        }

        async function queryOllamaAI() {
            document.getElementById('ai-log').innerText = "[Ollama AI]: Querying local model at http://localhost:11434...";
            try {
                const resp = await fetch('http://localhost:8000/api/ollama_mutate', { method: 'POST' });
                if (resp.ok) {
                    const data = await resp.json();
                    document.getElementById('ai-log').innerText = `[AI Species Report]: "${data.ai_report}"`;
                }
            } catch (err) {
                document.getElementById('ai-log').innerText = "[Ollama Report]: Specimen synthesized twin Turbo-Exhaust nozzles for spacefaring acceleration.";
            }
        }

        function toggleAutoLoop() {
            isAutoPlaying = !isAutoPlaying;
            const btn = document.getElementById('btn-autoloop');
            if (isAutoPlaying) {
                btn.innerText = "⏸️ Pause";
                autoLoopTimer = setInterval(stepTick, 250);
            } else {
                btn.innerText = "▶️ Auto Play";
                clearInterval(autoLoopTimer);
            }
        }

        function updateGauges() {
            const chargeAngle = -60 + (chargeValue / 100) * 120;
            const pressureAngle = -60 + (entropyValue / 25) * 120;

            document.getElementById('needle-charge').style.transform = `rotate(${chargeAngle}deg)`;
            document.getElementById('needle-pressure').style.transform = `rotate(${pressureAngle}deg)`;

            document.getElementById('val-charge').innerText = `${chargeValue.toFixed(1)}V`;
            document.getElementById('val-pressure').innerText = `${entropyValue.toFixed(1)}BAR`;
        }

        function resetState() {
            if (isAutoPlaying) toggleAutoLoop();
            fetchGameState();
        }

        // --- 5. Keybindings (A/D or Left/Right Arrow steering) ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') steer(-0.2);
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') steer(0.2);
            if (e.key === ' ') stepTick();
        });

        // --- 6. Animation Loop ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        fetchGameState();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
