<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidia-7 Harmony — Autonomous Ecosystem Simulator & Spectator UI</title>
    <style>
        :root {
            --bg-dark: #07080b;
            --brass-gold: #d4af37;
            --copper-accent: #b87333;
            --cyan-glow: #00f0ff;
            --crimson-glow: #ff3344;
            --purple-glow: #aa00ff;
            --panel-bg: rgba(14, 16, 22, 0.92);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Courier New', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e6ed;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay HUD */
        .hud-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px;
        }

        .header-panel {
            background: var(--panel-bg);
            border: 2px solid var(--brass-gold);
            box-shadow: 0 0 22px rgba(212, 175, 55, 0.4), inset 0 0 14px rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            padding: 14px 20px;
            max-width: 540px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        .header-panel h1 {
            color: var(--brass-gold);
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .doom-clock-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--copper-accent);
            border-radius: 4px;
            padding: 6px 10px;
            margin-top: 6px;
            font-size: 0.8rem;
        }

        .doom-years {
            color: #ff4500;
            font-weight: bold;
            font-family: monospace;
        }

        .harmony-val {
            color: var(--cyan-glow);
            font-weight: bold;
        }

        /* Species Legend Bar */
        .species-legend {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .legend-tag {
            padding: 3px 7px;
            border-radius: 4px;
            border: 1px solid #444;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Controls Panel (God Mode Overseer) */
        .controls-panel {
            background: var(--panel-bg);
            border: 2px solid var(--copper-accent);
            border-radius: 8px;
            padding: 12px 15px;
            max-width: 480px;
            pointer-events: auto;
            align-self: flex-end;
            backdrop-filter: blur(10px);
        }

        .god-title {
            font-size: 0.82rem;
            color: var(--brass-gold);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        .punk-btn {
            background: linear-gradient(180deg, #3a2a1a 0%, #1f160e 100%);
            border: 1px solid var(--brass-gold);
            color: var(--brass-gold);
            padding: 8px 6px;
            font-size: 0.72rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            text-align: center;
        }

        .punk-btn:hover {
            background: var(--brass-gold);
            color: #000;
            box-shadow: 0 0 10px var(--brass-gold);
        }

        .ai-log-box {
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.75);
            border-left: 3px solid var(--brass-gold);
            font-size: 0.75rem;
            color: #d0d8e2;
            max-height: 55px;
            overflow-y: auto;
            font-style: italic;
        }
    </style>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="hud-overlay">
        <!-- Header Panel -->
        <div class="header-panel">
            <h1>⚙️ OBSIDIA-7 HARMONY</h1>
            <p>Autonomous Thermodynamic Ecosystem Simulator & Spectator Mode</p>
            <div class="doom-clock-bar">
                <div>💥 HELIOS-OMEGA: <span class="doom-years" id="doom-years">2,995,000 YRS</span></div>
                <div>DYNAMIC HARMONY: <span class="harmony-val" id="harmony-val">86.2%</span></div>
            </div>
            <div class="species-legend" id="species-legend">
                <!-- Species badges injected dynamically -->
            </div>
            <div class="ai-log-box" id="ai-log">
                [Log]: Autonomous Ecosystem active. Toggle 2 vs 4 Species or change Time Speed.
            </div>
        </div>

        <!-- Controls Panel (God Overseer) -->
        <div class="controls-panel">
            <div class="god-title">👑 OVERSEER GOD CONTROLS</div>
            <div class="btn-grid">
                <button class="punk-btn" onclick="toggleSpeciesCount()" id="btn-species-count">👥 2 Species</button>
                <button class="punk-btn" onclick="toggleSpeed()" id="btn-speed">⚡ Speed 1x</button>
                <button class="punk-btn" onclick="toggleGasStorm()" id="btn-gas">🌪️ G- Normal</button>
                <button class="punk-btn" onclick="toggleAutoPlay()" id="btn-autoloop">⏸️ Pause</button>
                <button class="punk-btn" onclick="focusNextSpecies()">🎥 Focus Cam</button>
                <button class="punk-btn" onclick="queryOllamaAI()">🤖 Ollama Log</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Scene & Lighting Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x07080b, 0.022);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 250);
        camera.position.set(0, 22, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x222530, 2.2);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xd4af37, 4.5);
        spotLight.position.set(20, 35, 20);
        spotLight.castShadow = true;
        scene.add(spotLight);

        const oceanGrid = new THREE.GridHelper(90, 45, 0xb87333, 0x1f160e);
        oceanGrid.position.y = -2.0;
        scene.add(oceanGrid);

        // --- 2. Materials & Meshes ---
        const blockGeom = new THREE.BoxGeometry(0.85, 0.85, 0.85);
        const materiaMaterial = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });

        const speciesGroup = new THREE.Group();
        scene.add(speciesGroup);

        const envGroup = new THREE.Group();
        scene.add(envGroup);

        // --- 3. God Mode Options & State ---
        let numSpecies = 2;
        let speedMult = 1.0;
        let currentGas = "G_minus";
        let isAutoPlaying = true;
        let autoPlayTimer = null;
        let focusedSpeciesIndex = 0;

        // Fetch live state from backend
        async function fetchGameState() {
            try {
                const resp = await fetch('http://localhost:8000/api/game_state');
                if (resp.ok) {
                    const data = await resp.json();
                    renderGameState(data);
                }
            } catch (err) {
                // Standalone offline preview
            }
        }

        async function stepAutonomousCycle() {
            try {
                const resp = await fetch('http://localhost:8000/api/game_tick', { method: 'POST' });
                if (resp.ok) {
                    const data = await resp.json();
                    renderGameState(data);
                }
            } catch (err) {
                // Standalone step
            }
        }

        async function updateGodSettings() {
            try {
                const resp = await fetch('http://localhost:8000/api/god_setting', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        num_species: numSpecies,
                        speed: speedMult,
                        gas_env: currentGas
                    })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    renderGameState(data);
                }
            } catch (err) {}
        }

        function renderGameState(data) {
            // Update Doom Clock
            if (data.doom_clock) {
                document.getElementById('doom-years').innerText = data.doom_clock.years_formatted;
                document.getElementById('harmony-val').innerText = `${data.doom_clock.harmony_index}%`;
            }

            // Render Species Organisms
            while (speciesGroup.children.length > 0) speciesGroup.remove(speciesGroup.children[0]);
            
            const speciesList = data.species_list || [];
            const legendContainer = document.getElementById('species-legend');
            legendContainer.innerHTML = '';

            speciesList.forEach((sp, idx) => {
                const theme = (sp.snapshot && sp.snapshot.theme) || { metal_color: 0xd4af37, glow_color: 0x00f0ff };
                
                // Add to HUD Legend
                const hexStr = `#${theme.glow_color.toString(16).padStart(6, '0')}`;
                legendContainer.innerHTML += `
                    <div class="legend-tag" style="border-color: ${hexStr};">
                        <span class="dot" style="background: ${hexStr};"></span>
                        ${sp.species_name} (${sp.snapshot.num_blocks}B)
                    </div>
                `;

                // Build 3D Mesh
                const spGroup = new THREE.Group();
                spGroup.position.set(sp.pos[0], sp.pos[1], sp.pos[2]);
                spGroup.rotation.y = sp.yaw;

                const mat = new THREE.MeshStandardMaterial({
                    color: theme.metal_color,
                    metalness: theme.metalness || 0.85,
                    roughness: theme.roughness || 0.3
                });

                const wireMat = new THREE.MeshBasicMaterial({
                    color: theme.glow_color,
                    wireframe: true
                });

                const blocks = (sp.blueprint && sp.blueprint.blocks) || [];
                blocks.forEach(b => {
                    const mesh = new THREE.Mesh(blockGeom, mat);
                    mesh.position.set(b.bcc[0]*0.9, b.bcc[1]*0.9, b.bcc[2]*0.9);
                    
                    const wire = new THREE.Mesh(blockGeom, wireMat);
                    wire.scale.set(1.02, 1.02, 1.02);
                    mesh.add(wire);
                    
                    spGroup.add(mesh);
                });

                speciesGroup.add(spGroup);

                // Focus Camera on selected species
                if (idx === focusedSpeciesIndex) {
                    controls.target.lerp(new THREE.Vector3(sp.pos[0], sp.pos[1], sp.pos[2]), 0.1);
                }
            });

            // Render Environment (Gas Clouds & Materia Nodes)
            if (data.environment) {
                while (envGroup.children.length > 0) envGroup.remove(envGroup.children[0]);
                
                (data.environment.gas_clouds || []).forEach(gc => {
                    const color = gc.type === "G_minus_minus" ? 0xff4500 : 0x00f0ff;
                    const cloudMat = new THREE.MeshBasicMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.2 });
                    const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(gc.radius, 12, 12), cloudMat);
                    cloudMesh.position.set(gc.pos[0], gc.pos[1], gc.pos[2]);
                    envGroup.add(cloudMesh);
                });

                (data.environment.materia_nodes || []).forEach(mn => {
                    const matMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.45), materiaMaterial);
                    matMesh.position.set(mn.pos[0], mn.pos[1], mn.pos[2]);
                    envGroup.add(matMesh);
                });
            }
        }

        // --- God Controls Handlers ---
        function toggleSpeciesCount() {
            numSpecies = numSpecies === 2 ? 4 : 2;
            document.getElementById('btn-species-count').innerText = `👥 ${numSpecies} Species`;
            updateGodSettings();
        }

        function toggleSpeed() {
            if (speedMult === 1.0) speedMult = 2.0;
            else if (speedMult === 2.0) speedMult = 4.0;
            else speedMult = 1.0;
            document.getElementById('btn-speed').innerText = `⚡ Speed ${speedMult}x`;
            updateGodSettings();
        }

        function toggleGasStorm() {
            currentGas = currentGas === "G_minus" ? "G_minus_minus" : "G_minus";
            document.getElementById('btn-gas').innerText = currentGas === "G_minus_minus" ? "🌪️ G-- Storm" : "🌪️ G- Normal";
            updateGodSettings();
        }

        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            document.getElementById('btn-autoloop').innerText = isAutoPlaying ? "⏸️ Pause" : "▶️ Play";
            if (isAutoPlaying) startAutoPlay();
            else clearInterval(autoPlayTimer);
        }

        function focusNextSpecies() {
            focusedSpeciesIndex = (focusedSpeciesIndex + 1) % numSpecies;
        }

        async function queryOllamaAI() {
            document.getElementById('ai-log').innerText = "[Ollama AI]: Querying model at http://localhost:11434...";
            try {
                const resp = await fetch('http://localhost:8000/api/ollama_mutate', { method: 'POST' });
                if (resp.ok) {
                    const data = await resp.json();
                    document.getElementById('ai-log').innerText = `[AI Ticker]: "${data.ai_report}"`;
                }
            } catch (err) {
                document.getElementById('ai-log').innerText = "[Ollama Report]: Species Brass-Aurum synthesized twin Out-G nozzles to evade Copper-Rubrum.";
            }
        }

        function startAutoPlay() {
            clearInterval(autoPlayTimer);
            autoPlayTimer = setInterval(stepAutonomousCycle, 200);
        }

        // --- 4. Animation Loop ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        startAutoPlay();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
