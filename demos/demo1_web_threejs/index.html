<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidia-7 Harmony — Web3D Visualizer & Live Engine Bridge</title>
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --brass-gold: #d4af37;
            --copper-accent: #b87333;
            --cyan-glow: #00f0ff;
            --orange-heat: #ff4500;
            --panel-bg: rgba(18, 20, 26, 0.88);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Courier New', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #e0e6ed;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay UI - Riveting-Punk Panel */
        .hud-overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header-panel {
            background: var(--panel-bg);
            border: 2px solid var(--brass-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3), inset 0 0 10px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 15px 25px;
            max-width: 480px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        .header-panel h1 {
            color: var(--brass-gold);
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-panel p {
            font-size: 0.82rem;
            color: #a0aec0;
            line-height: 1.3;
        }

        /* Analog Gauges Panel */
        .gauges-container {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .gauge-card {
            background: radial-gradient(circle, #1a1d24 0%, #0d0e12 100%);
            border: 4px solid var(--brass-gold);
            border-radius: 50%;
            width: 135px;
            height: 135px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9), inset 0 0 15px rgba(212,175,55,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge-glass {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }

        .gauge-title {
            font-size: 0.65rem;
            color: var(--brass-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .gauge-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            margin-top: 2px;
            font-family: monospace;
        }

        .gauge-needle {
            position: absolute;
            width: 3px;
            height: 42px;
            background: #ff3333;
            bottom: 50%;
            left: calc(50% - 1.5px);
            transform-origin: bottom center;
            transform: rotate(-60deg);
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 5px rgba(255, 51, 51, 0.8);
        }

        .gauge-pivot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--brass-gold);
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--panel-bg);
            border: 2px solid var(--copper-accent);
            border-radius: 8px;
            padding: 15px;
            max-width: 420px;
            pointer-events: auto;
            align-self: flex-end;
            backdrop-filter: blur(8px);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .punk-btn {
            background: linear-gradient(180deg, #3a2a1a 0%, #1f160e 100%);
            border: 1px solid var(--brass-gold);
            color: var(--brass-gold);
            padding: 9px 10px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .punk-btn:hover {
            background: var(--brass-gold);
            color: #000;
            box-shadow: 0 0 10px var(--brass-gold);
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background: rgba(0, 240, 255, 0.2);
            color: var(--cyan-glow);
            border: 1px solid var(--cyan-glow);
        }

        /* AI Log Banner */
        .ai-log-box {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid var(--brass-gold);
            font-size: 0.75rem;
            color: #d0d8e2;
            max-height: 60px;
            overflow-y: auto;
            font-style: italic;
        }
    </style>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="hud-overlay">
        <!-- Header Panel -->
        <div class="header-panel">
            <h1>⚙️ OBSIDIA-7 HARMONY</h1>
            <p>Web3D Three.js PBR Engine & Kirchhoff Solver</p>
            <div style="margin-top: 8px; display: flex; gap: 8px; align-items: center;">
                <span class="status-badge" id="status-text">HARMONY: OK</span>
                <span style="font-size: 0.75rem; color: var(--brass-gold);" id="organism-name">Specimen: Aethel-Spark-Alpha</span>
            </div>
            <div class="ai-log-box" id="ai-log">
                [System Status]: Engine connected. Standing by for simulation step or Ollama AI mutation.
            </div>
        </div>

        <!-- Gauges and Controls Bottom Bar -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%;">
            <!-- Gauges -->
            <div class="gauges-container">
                <div class="gauge-card">
                    <div class="gauge-glass"></div>
                    <div class="gauge-needle" id="needle-charge"></div>
                    <div class="gauge-pivot"></div>
                    <div class="gauge-title">CHARGE</div>
                    <div class="gauge-value" id="val-charge">50.0V</div>
                </div>

                <div class="gauge-card">
                    <div class="gauge-glass"></div>
                    <div class="gauge-needle" id="needle-pressure"></div>
                    <div class="gauge-pivot"></div>
                    <div class="gauge-title">ENTROPY</div>
                    <div class="gauge-value" id="val-pressure">2.0BAR</div>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="controls-panel">
                <div style="font-size: 0.82rem; color: var(--brass-gold); font-weight: bold;">LIVE ENGINE CONTROLS</div>
                <div class="btn-grid">
                    <button class="punk-btn" onclick="stepEngine()">⏩ Step Cycle</button>
                    <button class="punk-btn" onclick="queryOllamaAI()">🤖 Ollama Mutate</button>
                    <button class="punk-btn" onclick="toggleRotate()">🔄 Auto Rotate</button>
                    <button class="punk-btn" onclick="resetOrganism()">♻️ Reset State</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Scene Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0b0e, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4.5, 3.5, 6.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0x222530, 1.8);
        scene.add(ambientLight);

        const brassSpotLight = new THREE.SpotLight(0xd4af37, 3.5);
        brassSpotLight.position.set(6, 10, 6);
        brassSpotLight.castShadow = true;
        scene.add(brassSpotLight);

        const cyanRimLight = new THREE.PointLight(0x00f0ff, 2.2, 12);
        cyanRimLight.position.set(-5, -2, -4);
        scene.add(cyanRimLight);

        // --- 3. Materials ---
        const brassMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            metalness: 0.85,
            roughness: 0.25
        });

        const copperMaterial = new THREE.MeshStandardMaterial({
            color: 0xb87333,
            metalness: 0.9,
            roughness: 0.4
        });

        const cyanGlowMaterial = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            wireframe: true
        });

        const orangeGlowMaterial = new THREE.MeshBasicMaterial({
            color: 0xff4500,
            wireframe: true
        });

        const blockGeom = new THREE.BoxGeometry(0.85, 0.85, 0.85);
        const organismGroup = new THREE.Group();
        scene.add(organismGroup);

        // --- 4. Simulation State & API Calls ---
        let chargeValue = 50.0;
        let entropyValue = 2.0;
        let autoRotate = true;

        async function fetchOrganismState() {
            try {
                const resp = await fetch('http://localhost:8000/api/organism');
                if (resp.ok) {
                    const data = await resp.json();
                    renderOrganismBlueprint(data);
                }
            } catch (err) {
                // Standalone offline rendering preview if server not running
                renderStandalonePreview();
            }
        }

        function renderOrganismBlueprint(data) {
            // Clear previous mesh
            while (organismGroup.children.length > 0) {
                organismGroup.remove(organismGroup.children[0]);
            }

            chargeValue = data.charge || 50.0;
            entropyValue = data.entropy || 2.0;
            document.getElementById('organism-name').innerText = `Specimen: ${data.species} (${data.size} Blocks)`;

            const blocks = data.blocks || [];
            blocks.forEach(b => {
                const mat = b.type === "In-G" ? copperMaterial : brassMaterial;
                const mesh = new THREE.Mesh(blockGeom, mat);
                
                // Map BCC coordinates (scaled down for 3D view)
                const scale = 0.95;
                mesh.position.set(b.bcc[0] * scale, b.bcc[1] * scale, b.bcc[2] * scale);
                
                // Add glowing filament frame
                const frameMat = b.voltage > 10.0 ? orangeGlowMaterial : cyanGlowMaterial;
                const wireframe = new THREE.Mesh(blockGeom, frameMat);
                wireframe.scale.set(1.03, 1.03, 1.03);
                mesh.add(wireframe);

                organismGroup.add(mesh);
            });

            updateGauges();
        }

        function renderStandalonePreview() {
            while (organismGroup.children.length > 0) {
                organismGroup.remove(organismGroup.children[0]);
            }
            const bccCoords = [[0,0,0], [1,1,1], [2,0,2], [3,1,3], [4,2,4]];
            bccCoords.forEach((c, idx) => {
                const mesh = new THREE.Mesh(blockGeom, idx % 2 === 0 ? brassMaterial : copperMaterial);
                mesh.position.set(c[0]*0.9, c[1]*0.9, c[2]*0.9);
                const wireframe = new THREE.Mesh(blockGeom, cyanGlowMaterial);
                wireframe.scale.set(1.02, 1.02, 1.02);
                mesh.add(wireframe);
                organismGroup.add(mesh);
            });
            updateGauges();
        }

        async function stepEngine() {
            try {
                const resp = await fetch('http://localhost:8000/api/step', { method: 'POST' });
                if (resp.ok) {
                    const data = await resp.json();
                    document.getElementById('status-text').innerText = `EVENT: ${data.event}`;
                    if (data.mutation_note) {
                        document.getElementById('ai-log').innerText = `[Step Mutation]: ${data.mutation_note}`;
                    }
                    fetchOrganismState();
                }
            } catch (err) {
                chargeValue = Math.min(100.0, chargeValue + 5.0);
                entropyValue = Math.max(0.5, entropyValue - 0.2);
                document.getElementById('status-text').innerText = "STEP: CHARGE BOOSTED";
                updateGauges();
            }
        }

        async function queryOllamaAI() {
            document.getElementById('ai-log').innerText = "[Local Ollama]: Querying model at http://localhost:11434...";
            try {
                const resp = await fetch('http://localhost:8000/api/ollama_mutate', { method: 'POST' });
                if (resp.ok) {
                    const data = await resp.json();
                    document.getElementById('ai-log').innerText = `[Ollama Report]: "${data.ai_report}"`;
                }
            } catch (err) {
                document.getElementById('ai-log').innerText = "[Ollama Offline Fallback]: Organism evolved brass thermal exhaust vanes.";
            }
        }

        function updateGauges() {
            const chargeAngle = -60 + (chargeValue / 100) * 120;
            const pressureAngle = -60 + (entropyValue / 25) * 120;

            document.getElementById('needle-charge').style.transform = `rotate(${chargeAngle}deg)`;
            document.getElementById('needle-pressure').style.transform = `rotate(${pressureAngle}deg)`;

            document.getElementById('val-charge').innerText = `${chargeValue.toFixed(1)}V`;
            document.getElementById('val-pressure').innerText = `${entropyValue.toFixed(1)}BAR`;
        }

        function toggleRotate() {
            autoRotate = !autoRotate;
        }

        function resetOrganism() {
            chargeValue = 50.0;
            entropyValue = 2.0;
            document.getElementById('status-text').innerText = "HARMONY: OK";
            document.getElementById('ai-log').innerText = "[Reset]: State restored to initial Primal Spark.";
            fetchOrganismState();
        }

        // --- 5. Animation Loop ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (autoRotate) {
                organismGroup.rotation.y = elapsedTime * 0.3;
                organismGroup.rotation.x = Math.sin(elapsedTime * 0.15) * 0.1;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        fetchOrganismState();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
